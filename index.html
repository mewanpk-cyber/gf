<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مەموندی جوگرافیا</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--a:#1b3a5c;--b:#0b1a2e;--ink:#f4f7fb;--mut:rgba(244,247,251,.62);--glass:rgba(255,255,255,.1);--line:rgba(255,255,255,.16);--gold:#ffc861;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--b);color:var(--ink);font-family:'Noto Naskh Arabic','Noto Kufi Arabic',Tahoma,serif;min-height:100vh;
background:linear-gradient(170deg,var(--a),var(--b) 70%);transition:background 1s;overflow-x:hidden}
h1,h2,.k{font-family:'Noto Kufi Arabic',Tahoma,sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header h1{font-size:22px;font-weight:800;letter-spacing:0}
header small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 16px;border-radius:99px;font:600 14px 'Noto Kufi Arabic',sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--b);border-color:var(--ink)}
.chip:focus-visible,.pin:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{position:relative;text-align:center;padding:10px 0 22px}
.hero .ic{height:150px;display:flex;justify-content:center;align-items:center}
.temp{font:800 92px/1 'Noto Kufi Arabic',sans-serif;direction:ltr;display:inline-block}
.temp sup{font-size:34px;font-weight:600;vertical-align:top;margin-inline-start:2px;color:var(--gold)}
.cond{font:600 20px 'Noto Kufi Arabic',sans-serif;margin-top:4px}
.sub{color:var(--mut);font-size:15px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 16px}
.st{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;backdrop-filter:blur(10px)}
.st b{display:block;font:800 17px 'Noto Kufi Arabic',sans-serif;direction:ltr}
.st span{font-size:12px;color:var(--mut)}
.st svg{width:22px;height:22px;margin-bottom:4px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:16px;margin-bottom:16px;backdrop-filter:blur(12px)}
.panel h2{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--mut)}
.mapbox{overflow-x:auto;border-radius:20px;direction:ltr;scrollbar-width:none;border:1px solid var(--line)}.mapbox::-webkit-scrollbar{display:none}
.map{position:relative;width:820px;aspect-ratio:1000/740;background:#e8ecdb;direction:ltr}
.map svg.base{width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.cl{animation:cld 10s ease-in-out infinite alternate}@keyframes cld{to{transform:translateX(14px)}}.rd{animation:dr 1s linear infinite}.rb{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px;font-size:14px}.rb div{display:flex;align-items:center;gap:8px}.rb svg{width:30px;height:30px;flex:none}.hint{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:#10243b;font:800 12px 'Noto Kufi Arabic',sans-serif}
.pin .bub{background:#fff;border-radius:14px;padding:3px 7px 3px 9px;display:flex;align-items:center;gap:3px;box-shadow:0 4px 12px rgba(16,36,59,.25);direction:ltr;transition:transform .25s}
.pin .bub svg{width:20px;height:20px}
.pin .nm{margin-top:1px;font-size:10px;white-space:nowrap;font-weight:600;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.pin.on .bub{background:#10243b;color:#fff;transform:scale(1.22)}
.pin.on::after{content:"";position:absolute;top:2px;width:44px;height:30px;border-radius:50%;border:2px solid #10243b;animation:pr 2s infinite;pointer-events:none}
@keyframes pr{from{transform:scale(.9);opacity:.8}to{transform:scale(2.2);opacity:0}}
.hours{display:flex;gap:10px;overflow-x:auto;direction:rtl;scrollbar-width:none}
.hr{flex:none;width:62px;text-align:center;font-size:13px}
.hr svg{width:34px;height:34px;display:block;margin:6px auto}
.hr b{font:800 15px 'Noto Kufi Arabic',sans-serif;direction:ltr;display:block}
.day{display:grid;grid-template-columns:78px 40px 1fr 90px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.day:first-of-type{border-top:0}
.day svg{width:32px;height:32px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.14);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#6ec6ff,var(--gold))}
.rng{direction:ltr;font:600 13px 'Noto Kufi Arabic',sans-serif;text-align:left;color:var(--mut)}
.rng b{color:var(--ink)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
/* icons */
.sun-r{transform-origin:50px 50px;animation:spin 24s linear infinite}
.fl{animation:fl 5s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite reverse}
.dr{animation:dr 1s linear infinite}.dr:nth-child(2){animation-delay:.3s}.dr:nth-child(3){animation-delay:.6s}
.sn{animation:sn 3s linear infinite}.sn:nth-child(2){animation-delay:1s}.sn:nth-child(3){animation-delay:2s}
.bolt{animation:bz 2.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fl{50%{transform:translateX(5px)}}
@keyframes dr{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(12px);opacity:0}}
@keyframes sn{from{transform:translateY(-6px) rotate(0);opacity:0}30%{opacity:1}to{transform:translateY(14px) rotate(180deg);opacity:0}}
@keyframes bz{0%,60%,100%{opacity:.25}65%,75%{opacity:1}70%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#ff9d57"/></linearGradient></defs><circle cx="23" cy="23" r="22" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.25)"/><circle cx="30" cy="15" r="6" fill="url(#lg)"/><path d="M5 35 15 19l6 8 5-7 15 15z" fill="#f4f7fb"/><path d="M15 19l-3.5 5.5L15 23l2.5 2z" fill="#9fb7d0"/></svg>
<div><h1>مەموندی جوگرافیا</h1><small>ئاسمان و زەوی، لە کوردستانەوە</small></div>
</header>
<div class="chips" id="chips" role="group" aria-label="شارەکان"></div>
<section class="hero">
<div class="ic" id="ic"></div>
<div class="temp"><span id="t">0</span><sup>°</sup></div>
<div class="cond" id="cond"></div>
<div class="sub" id="sub"></div>
</section>

<div class="panel"><h2>نەخشەی کەشوهەوای کوردستان</h2>
<div class="rb" id="rb" role="status"></div><div class="mapbox" id="mb"><div class="map" id="map"><svg class="base" id="svg" viewBox="0 0 1000 740" aria-hidden="true"></svg><svg class="fx" id="fx" viewBox="0 0 1000 740" aria-hidden="true"></svg></div></div><div class="hint">بۆ بینینی هەموو کوردستان بە لای چەپ و ڕاستدا بجووڵێنە</div></div>
<div class="panel"><h2>کاتژمێر بە کاتژمێر</h2><div class="hours" id="hours"></div></div>
<div class="panel"><h2>پێشبینی پێنج ڕۆژ</h2><div id="days"></div></div>
<footer id="stat" role="status">داتای نموونە · پەیوەندی بە AccuWeather دەکرێت…</footer>
</div>
<script>
const W={sun:{n:'ڕۆژهەتاو',a:'#2a6fb0',b:'#0f2a4a'},part:{n:'کەمێک هەور',a:'#35608f',b:'#13243c'},cloud:{n:'هەوراوی',a:'#4a5d73',b:'#1a2330'},rain:{n:'باران',a:'#2f4a68',b:'#0d1826'},storm:{n:'هەورە تریشقە',a:'#3a3556',b:'#0e0c1a'},snow:{n:'بەفربارین',a:'#6b88a8',b:'#1d2d44'},clear:{n:'ئاسمانی ڕوون',a:'#1b3a5c',b:'#0b1a2e'}};
const cloud=(x,y,s,c)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M22 48a14 14 0 0 1 2-28 18 18 0 0 1 34-3 15 15 0 0 1 8 31z" fill="${c||'#eaf1f8'}"/></g>`;
function icon(t){let s='';
const sun=(x,y,r)=>`<g transform="translate(${x-50} ${y-50})"><g class="sun-r">${[...Array(8)].map((_,i)=>`<rect x="48" y="${50-r-13}" width="4" height="9" rx="2" fill="#ffc861" transform="rotate(${i*45} 50 50)"/>`).join('')}</g><circle cx="50" cy="50" r="${r}" fill="#ffd27a"/></g>`;
if(t=='sun'||t=='clear')s=sun(50,50,19);

if(t=='rain')s=cloud(14,14,.95,'#c5d3e2')+[28,46,64].map((x,i)=>`<path class="dr" d="M${x} 66l-3 9" stroke="#7cc4ff" stroke-width="3.5" stroke-linecap="round"/>`).join('');
if(t=='storm')s=cloud(14,10,.95,'#9aa6bd')+`<path class="bolt" d="M52 52 40 72h10l-4 18 17-24H52l6-14z" fill="#ffd45a"/>`;
if(t=='snow')s=cloud(14,12,.95,'#d6e2ee')+[28,48,66].map(x=>`<text class="sn" x="${x}" y="72" font-size="14" text-anchor="middle" fill="#fff">❄</text>`).join('');
if(t=='clear'&&0)s='';
return `<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">${s}</svg>`}
const R=[['هەولێر','Erbil',44.01,36.19],['سلێمانی','Sulaymaniyah',45.43,35.56],['دهۆک','Duhok',43,36.87],['کەرکووک','Kirkuk',44.39,35.47],['ئامەد','Diyarbakir',40.23,37.91],['وان','Van Turkey',43.38,38.49],['دێرسم','Tunceli',39.55,39.11],['مێردین','Mardin',40.74,37.31],['قامیشلۆ','Qamishli',41.22,37.05],['کۆبانێ','Kobani',38.35,36.89],['عەفرین','Afrin',36.87,36.51],['سنە','Sanandaj',47,35.31],['مەهاباد','Mahabad',45.72,36.76],['کرماشان','Kermanshah',47.06,34.31],['ورمێ','Urmia',45.07,37.55]];
const PX=lo=>(lo-36)/13*1000,PY=la=>(40.3-la)*94.9;
const K0=['sun','part','cloud','rain','sun','storm','snow'];
const C=R.map((r,i)=>({n:r[0],q:r[1],lo:r[2],la:r[3],x:PX(r[2])/1000,y:PY(r[3])/740,t:Math.round(33-(r[3]-33)*1.6),c:K0[i%7],h:30+i*3,w:8+i%9,p:i%4*20,u:i%9}));
const D=['شەممە','یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە','هەینی'],kinds=['sun','part','cloud','rain','part','sun','storm'];
let cur=0;
const $=id=>document.getElementById(id);
const stI={w:'<path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>',h:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/>',p:'<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 10 1 3.500 3.500 0 0 1 0 7zM9 21v-1M13 21v-1"/>',u:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'};
function stat(k,v,l){return `<div class="st"><svg viewBox="0 0 24 24">${stI[k]}</svg><b>${v}</b><span>${l}</span></div>`}
function pins(){const m=$('map');m.querySelectorAll('.pin').forEach(e=>e.remove());
C.forEach((c,i)=>{const b=document.createElement('button');b.className='pin'+(i==cur?' on':'');b.style.left=c.x*100+'%';b.style.top=c.y*100+'%';b.setAttribute('aria-label',c.n);
b.innerHTML=`<span class="bub">${icon(c.c)}<span>${c.t}°</span></span><span class="nm">${c.n}</span>`;b.onclick=()=>sel(i);m.appendChild(b)});
fx();const mb=$('mb');mb.scrollTo({left:C[cur].x*m.offsetWidth-mb.clientWidth/2,behavior:'smooth'})}
function fx(){let o='<defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter></defs>';const g={rain:[],storm:[],snow:[]};
C.forEach(c=>{if(g[c.c])g[c.c].push(c.n);if(!['rain','storm','snow','cloud'].includes(c.c))return;const x=PX(c.lo),y=PY(c.la),st=c.c=='storm',lt=c.c=='cloud';
o+=`<g transform="translate(${x} ${y})"><ellipse class="cl" rx="${lt?46:80}" ry="${lt?30:52}" fill="${st?'#7d7f9c':lt?'#fff':'#e1e8ef'}" opacity="${lt?.35:.62}" filter="url(#bl)"/>`;
if(c.c=='rain'||st)for(let k=0;k<7;k++)o+=`<path class="rd" d="M${-40+k*13} -8l-4 11" stroke="#3f8fd8" stroke-width="2.6" stroke-linecap="round" style="animation-delay:${k*.17}s"/>`;
if(st)o+=`<path class="bolt" d="M-22 -36l-12 24h10l-6 20 18-28h-10l7-16z" fill="#f6dcff" stroke="#b57be0" stroke-width="1.3"/><path class="bolt" style="animation-delay:.9s" d="M26 -12l-9 18h8l-4 14 13-21h-8l5-11z" fill="#f6dcff" stroke="#b57be0" stroke-width="1.3"/>`;
if(c.c=='snow')for(let k=0;k<5;k++)o+=`<text class="sn" x="${-36+k*18}" y="0" font-size="16" fill="#fff" style="animation-delay:${k*.5}s">❄</text>`;
o+='</g>'});$('fx').innerHTML=o;
const L=[['rain','باران دەبارێت لە'],['storm','هەورە تریشقە و باران لە'],['snow','بەفر دەبارێت لە']];
$('rb').innerHTML=L.filter(l=>g[l[0]].length).map(l=>`<div>${icon(l[0])}<span>${l[1]}: <b>${g[l[0]].join('، ')}</b></span></div>`).join('');$('rb').style.display=$('rb').innerHTML?'flex':'none'}
const P=(lo,la)=>PX(lo).toFixed(1)+' '+PY(la).toFixed(1);
const poly=a=>'M'+a.map(p=>P(p[0],p[1])).join('L')+'Z',line=a=>'M'+a.map(p=>P(p[0],p[1])).join('L');
function drawMap(){const G=[[[36.9,37.7],[37.6,39],[39.5,39.9],[41.2,40.1],[42.8,40.1],[43.8,40],[44.2,39.7],[44.4,38.3],[44.8,37.2],[43.5,37.2],[42.35,37.1],[41,37.1],[39,36.85],[38,36.85],[37.2,36.7]],
[[42.35,37.1],[41,37.1],[39,36.85],[38,36.85],[37.2,36.7],[36.6,36.45],[37.4,36.35],[38.5,36.45],[40,36.2],[41.2,36.4],[42,36.6]],
[[42.35,37.1],[43.5,37.2],[44.8,37.2],[45.1,36.8],[45.5,36.1],[45.95,35.65],[46.2,35.2],[45.6,34.5],[45.4,34.1],[44.6,34.7],[44,35.1],[43.5,35.8],[43.1,36.3],[42.3,36.5],[41.9,36.55]],
[[44.2,39.7],[45,39.1],[45.4,38.4],[45.7,37.6],[46.4,37],[47.4,36.5],[48.2,35.9],[48.5,34.9],[48,34],[47.3,33.4],[46.4,33],[45.9,33.7],[45.6,34.5],[46.2,35.2],[45.95,35.65],[45.5,36.1],[45.1,36.8],[44.8,37.2],[44.4,38.3]]];
const col=['#ead7a0','#f3c7a2','#b8d6a4','#cdbfe0'],nm=['باکوور','ڕۆژئاوا','باشوور','ڕۆژهەڵات'],lb=[[41.3,38.9],[39.4,36.6],[44.3,35.4],[47,35.9]];
let o=`<defs><linearGradient id="sea" x1="0" x2="1"><stop offset="0" stop-color="#9cc3d8"/><stop offset="1" stop-color="#cfe3ea"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10243b" flood-opacity=".35"/></filter></defs><rect width="1000" height="740" fill="#e8ecdb"/>`;
o+=`<path d="M-10 ${PY(37.05)}L${P(36.05,36.95)}L${P(36.2,36.6)}L${P(35.95,36.2)}L${P(36.05,35.4)}L${P(36.0,32.4)}L-10 800Z" fill="url(#sea)"/>`;
o+=`<rect x="0" y="0" width="1000" height="740" fill="#e6efe0" opacity=".0"/>`;
for(let l=36;l<=49;l++)o+=`<path d="M${PX(l)} 0V740" stroke="#10243b" stroke-opacity=".07"/>`;
for(let l=33;l<=40;l++)o+=`<path d="M0 ${PY(l)}H1000" stroke="#10243b" stroke-opacity=".07"/>`;

[[42.95,38.6,.45,.25,0],[45.5,37.65,.28,.55,-15],[44.95,35.95,.22,.08,20]].forEach(e=>o+=`<ellipse cx="${PX(e[0])}" cy="${PY(e[1])}" rx="${e[2]*76.9}" ry="${e[3]*94.9}" transform="rotate(${e[4]} ${PX(e[0])} ${PY(e[1])})" fill="#8fbad0" stroke="#fff" stroke-width="2"/>`);
[[[39.7,38.7],[38.6,37.6],[38.1,36.8]],[[40.1,38.1],[41.6,37.65],[42.4,37.15],[42.5,36.8],[43.1,36.3],[43.15,35.5]],[[43.4,37.5],[43.8,36.7],[43.4,36.1]],[[46,35.7],[45,35.9],[44.5,35.8]],[[44.2,38.2],[43.5,37.3],[42.3,37.1]]].forEach(r=>o+=`<path d="${line(r)}" fill="none" stroke="#5d9ec7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`);
[[[37.5,37.5],[39.5,38.2],[41.5,38.2],[43.5,38.2],[44.3,37.6]],[[44.3,38.3],[45.5,36.8],[46.5,35.7],[47.5,34.6],[48.2,33.4]]].forEach((m,k)=>{for(let i=0;i<m.length-1;i++)for(let t=0;t<1;t+=.2){const lo=m[i][0]+(m[i+1][0]-m[i][0])*t,la=m[i][1]+(m[i+1][1]-m[i][1])*t,j=Math.sin(i*7+t*13+k)*.12,z=9+Math.abs(Math.cos(i*5+t*9))*7,x=PX(lo+j),y=PY(la+j);o+=`<path d="M${x-z} ${y+z*.6}L${x} ${y-z}L${x+z} ${y+z*.6}Z" fill="#8fa383" stroke="#5f7656" stroke-width="1" opacity=".75"/><path d="M${x} ${y-z}L${x+z*.35} ${y-z*.2}L${x-z*.25} ${y-z*.3}Z" fill="#fff" opacity=".8"/>`}});
nm.forEach((n,i)=>o+=`<text x="${PX(lb[i][0])}" y="${PY(lb[i][1])}" text-anchor="middle" font-family="Noto Kufi Arabic" font-weight="800" font-size="30" fill="#10243b" fill-opacity=".28" letter-spacing="1">${n}</text>`);
o+=`<text x="500" y="705" text-anchor="middle" font-family="Noto Kufi Arabic" font-weight="800" font-size="40" fill="#10243b" fill-opacity=".5">کوردستان</text>`;
let sx=70,sy=80;o+=`<g transform="translate(${sx} ${sy})"><g fill="#f7b92c">`+[...Array(21)].map((_,i)=>`<path d="M-4 -34L0 -52L4 -34Z" transform="rotate(${i*360/21})"/>`).join('')+`</g><circle r="30" fill="#f7b92c"/><circle r="22" fill="#fff" fill-opacity=".35"/></g>`;
$('svg').innerHTML=o}
drawMap();
function chips(){$('chips').innerHTML='';C.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=c.n;b.setAttribute('aria-pressed',i==cur);b.onclick=()=>sel(i);$('chips').appendChild(b)})}
function sel(i){cur=i;const c=C[i],w=W[c.c];
document.documentElement.style.setProperty('--a',w.a);document.documentElement.style.setProperty('--b',w.b);
$('ic').innerHTML=icon(c.c);$('ic').firstChild.style.maxWidth='150px';
$('cond').textContent=w.n;$('sub').textContent=c.n+' · هەست دەکرێت بە '+(c.t-Math.round(c.w/8))+'°';
let n=0,from=+$('t').textContent,to=c.t;const id=setInterval(()=>{from+=Math.sign(to-from);$('t').textContent=from;if(from==to)clearInterval(id)},35);
$('stats').innerHTML=stat('w',c.w+' km/h','با')+stat('h',c.h+'%','شێ')+stat('p',c.p+'%','باران')+stat('u',c.u,'تیشکی UV');
$('hours').innerHTML=[...Array(10)].map((_,k)=>{const hr=(14+k)%24,night=hr>=19||hr<6;const t=c.t-Math.round(Math.abs(k-1)*1.6)+(night?-2:0);
const kind=night&&c.c=='sun'?'clear':(k>5&&c.c=='part'?'cloud':c.c);return `<div class="hr"><span>${hr}:00</span>${icon(kind)}<b>${t}°</b></div>`}).join('');
$('days').innerHTML=[...Array(5)].map((_,k)=>{const d=D[(5+k+1)%7],lo=c.t-9+((k*3)%4),hi=c.t+((k*5)%6)-2,kd=k==0?c.c:kinds[(i+k*2)%7];
return `<div class="day"><span>${k?d:'ئەمڕۆ'}</span>${icon(kd)}<div class="bar"><i style="right:${(lo-0)*2.200}%;left:${100-hi*2.200-6}%"></i></div><div class="rng"><b>${hi}°</b> / ${lo}°</div></div>`}).join('');
chips();pins()}
sel(0);
/* ---- AccuWeather live layer ---- */
const SRV='AccuWeather®',WD=['یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە','هەینی','شەممە'];
const kind=k=>[1,2,5,30].includes(k)?'sun':[33,34].includes(k)?'clear':[3,4,35,36].includes(k)?'part':[15,16,17,41,42].includes(k)?'storm':[12,13,14,18,25,26,29,39,40].includes(k)?'rain':[19,20,21,22,23,24,43,44].includes(k)?'snow':[6,7,8,11,32,37,38].includes(k)?'cloud':'part';
const status=m=>$('stat').textContent=m;
const ERR={server_not_connected:'AccuWeather لە ڕێکخستنی کۆنێکتەرەکان زیاد بکە',needs_reauth:'AccuWeather دووبارە ببەستەرەوە',not_in_manifest:'ڕێگەت نەدا بە AccuWeather بۆ ئەم لاپەڕەیە',consent_required:'ڕێگەت نەدا بە AccuWeather بۆ ئەم لاپەڕەیە',blocked_by_policy:'ڕێکخراوەکەت AccuWeather ڕێگە پێنەدراوە',server_unavailable:'AccuWeather ئێستا بەردەست نییە، دواتر هەوڵ بدەوە'};
let mcp=null;
const call=(t,q)=>mcp.callTool(SRV,t,{queryParams:q}).then(r=>r.payload);
function liveView(i){const c=C[i];if(i!=cur||!c.L)return;
if(c.L.hours)$('hours').innerHTML=c.L.hours.map(h=>`<div class="hr"><span>${h.hr}:00</span>${icon(h.k)}<b>${h.t}°</b></div>`).join('');
if(c.L.days)$('days').innerHTML=c.L.days.map((d,k)=>`<div class="day"><span>${k?WD[new Date(d.dt+'T12:00:00Z').getUTCDay()]:'ئەمڕۆ'}</span>${icon(d.k)}<div class="bar"><i style="right:${d.lo/45*100}%;left:${100-d.hi/45*100}%"></i></div><div class="rng"><b>${d.hi}°</b> / ${d.lo}°</div></div>`).join('')}
const _sel=sel;
sel=async function(i){_sel(i);const c=C[i];pins();if(!c.key)return;c.L=c.L||{};liveView(i);
if(!c.L.days){try{const d=await call('widgets-daily-claude',{locationKey:c.key,unit:'metric'});c.p=d.dailyForecast[0].day.rainProbabilityValue;c.L.days=d.dailyForecast.slice(0,5).map(x=>({hi:Math.round(x.day.temperature),lo:Math.round(x.night.temperature),k:kind(x.day.icon),dt:x.date.slice(0,10)}));if(i==cur){_sel(i);liveView(i)}}catch(e){}}
if(!c.L.hours){try{const h=await call('widgets-hourly-claude',{locationKey:c.key,unit:'metric'});c.L.hours=h.hourlyForecast.slice(0,10).map(x=>({hr:+x.date.slice(11,13),t:Math.round(x.temperatureValue),k:kind(x.icon)}));liveView(i)}catch(e){}}};
(async()=>{
try{mcp=await claude.use('mcp')}catch(e){}
if(!mcp){status('داتای نموونە · پەیوەندی بە AccuWeather بەردەست نییە لێرە');return}
let bad=null,ok=0,q=[...C];
const one=async c=>{try{const s=await call('widgets-search-claude',{query:c.q});c.key=s.results[0].locationKey;
const cu=await call('widgets-current-claude',{locationKey:c.key,unit:'metric'}),n=cu.currentConditions,e=n.extended;
c.t=Math.round(n.temperatureValue);c.c=kind(n.iconCode);c.h=e.humidityValue;c.u=Math.round(e.uv.value);c.w=parseInt((e.wind.match(/\d+/)||[0])[0]);c.live=1;ok++;pins()}
catch(e){bad=bad||e.code||'x'}};
await Promise.all([...Array(5)].map(async()=>{while(q.length)await one(q.shift())}));
if(ok){status('داتای زیندوو لە AccuWeather'+(ok<C.length?' · هەندێک شار بارنەبوون':''));sel(cur)}
else status(ERR[bad]||'نەتوانرا داتای AccuWeather بهێنرێت · داتای نموونە پیشان دەدرێت');
})();
</script>
